# Which places count as "in scope".
#
# To add a region later (e.g. Los Angeles, or all of Texas), add an entry
# under `regions:` and list its key in `active_regions`. No code changes.
#
# Each region has areas (shown in the website's Location filter). Each area
# lists city/place names to look for in a posting's location text.
#
# `state` is the two-letter state code. City names that also exist in other
# states or countries (Dublin, Newark, Richmond, Concord...) go under
# `ambiguous_places`; those only match when the location also mentions the
# state (e.g. "Dublin, CA" or "Dublin, California").

active_regions: [sf_bay_area, central_valley, socal]

# Also include fully remote roles open to people anywhere in the US.
include_remote_us: true

# Also include on-site and hybrid jobs anywhere else in the US. Jobs inside an
# active region keep that region's areas (San Francisco, East Bay...); all
# other US jobs are labeled by state (Texas, New York...). Set to false to
# go back to only the regions above + remote.
include_all_us: true

regions:
  sf_bay_area:
    label: Northern California
    # Regions that share a `group` are listed together under it on the site.
    group: California
    state: CA
    state_name: California
    # Name used in the "More places to search" links (LinkedIn, Indeed...)
    search_name: San Francisco Bay Area
    # Locations passed to USAJobs' LocationName search.
    usajobs_locations:
      - San Francisco, California
      - Oakland, California
      - San Jose, California
      - Santa Rosa, California
      - Napa, California
    # Phrases that mean "somewhere in this region".
    region_phrases: [bay area, sf bay, silicon valley, sfba]
    region_default_area: Bay Area (general)
    areas:
      San Francisco:
        places: [san francisco, "sf, ca", "s.f.", south san francisco]
      East Bay:
        places: [oakland, berkeley, emeryville, alameda county, san leandro,
                 hayward, fremont, union city, walnut creek, pleasanton,
                 livermore, san ramon, danville, orinda, lafayette, el cerrito,
                 martinez, pittsburg, antioch, castro valley, east bay]
        ambiguous_places: [alameda, richmond, concord, dublin, newark, albany]
      Peninsula:
        places: [daly city, san bruno, millbrae, burlingame, san mateo,
                 foster city, belmont, san carlos, redwood city, menlo park,
                 palo alto, east palo alto, half moon bay, pacifica,
                 redwood shores, brisbane, peninsula]
      South Bay / San Jose:
        places: [san jose, sunnyvale, mountain view, santa clara, cupertino,
                 milpitas, campbell, los gatos, los altos, saratoga,
                 morgan hill, gilroy, south bay]
      North Bay:
        places: [napa, sonoma, santa rosa, petaluma, san rafael, novato,
                 mill valley, sausalito, larkspur, corte madera, rohnert park,
                 healdsburg, calistoga, st. helena, saint helena, vallejo,
                 american canyon, benicia, marin, north bay]
        ambiguous_places: [fairfield]
      Sacramento area:
        places: [sacramento, west sacramento, elk grove, roseville, rocklin,
                 folsom, rancho cordova, citrus heights, davis, woodland,
                 chico, redding, eureka, arcata]
        ambiguous_places: [auburn, lincoln]
      Santa Cruz / Monterey:
        places: [santa cruz, scotts valley, watsonville, monterey, salinas,
                 seaside, carmel, carmel-by-the-sea, capitola]

  central_valley:
    label: Central Valley
    group: California
    state: CA
    state_name: California
    search_name: Fresno, CA
    usajobs_locations: [Fresno, California, Bakersfield, California]
    region_phrases: [central valley, san joaquin valley]
    region_default_area: Central Valley (general)
    areas:
      Fresno / Visalia:
        places: [fresno, clovis, visalia, tulare, hanford, madera, merced]
      Stockton / Modesto:
        places: [stockton, modesto, lodi, tracy, manteca, turlock, ceres]
      Bakersfield:
        places: [bakersfield, delano]

  socal:
    label: Southern California
    group: California
    state: CA
    state_name: California
    search_name: Los Angeles, CA
    usajobs_locations: [Los Angeles, California, San Diego, California]
    region_phrases: [southern california, socal, greater los angeles]
    region_default_area: Southern California (general)
    areas:
      Los Angeles:
        places: [los angeles, santa monica, culver city, west hollywood,
                 beverly hills, el segundo, playa vista, venice, marina del rey,
                 long beach, torrance, burbank, santa clarita, inglewood,
                 hawthorne, manhattan beach, west los angeles, hollywood]
        ambiguous_places: [pasadena, glendale, carson]
      Orange County:
        places: [irvine, anaheim, santa ana, costa mesa, newport beach,
                 huntington beach, orange county, fullerton, tustin,
                 lake forest, mission viejo, laguna niguel, aliso viejo]
      San Diego:
        places: [san diego, la jolla, carlsbad, oceanside, escondido,
                 chula vista, del mar, poway]
      Inland Empire:
        places: [riverside, san bernardino, rancho cucamonga, temecula,
                 palm springs, inland empire, moreno valley, fontana]
        ambiguous_places: [ontario, corona]
      Santa Barbara / Ventura:
        places: [santa barbara, goleta, ventura, oxnard, thousand oaks,
                 camarillo, san luis obispo]

  # Example of a future region (inactive until added to active_regions):
  # los_angeles:
  #   label: Los Angeles
  #   state: CA
  #   state_name: California
  #   search_name: Los Angeles, CA
  #   usajobs_locations: [Los Angeles, California]
  #   region_phrases: [greater los angeles, la area]
  #   region_default_area: Los Angeles
  #   areas:
  #     Los Angeles:
  #       places: [los angeles, santa monica, culver city, pasadena, burbank]
