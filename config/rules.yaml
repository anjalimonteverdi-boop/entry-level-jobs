# Rules for deciding what counts as entry-level, and for category tags.
# All matching is case-insensitive and on whole words/phrases.

entry_level:
  # Title words that suggest an entry-level role.
  include_title:
    - entry level
    - entry-level
    - associate
    - coordinator
    - assistant
    - junior
    - jr
    - new grad
    - new graduate
    - recent graduate
    - recent grad
    - university grad
    - early career
    - early-career
    - rotational
    - rotation program
    - apprentice
    - apprenticeship
    - graduate program
    - level 1
    - level i

  # Title words that mean the role is too senior. These win over the
  # include list, except for the phrases in `override_exclude`.
  exclude_title:
    - senior
    - sr
    - lead
    - principal
    - staff
    - manager
    - management
    - director
    - head of
    - vp
    - vice president
    - chief
    - architect
    - supervisor
    - iii
    - iv
    - v

  # Titles that contain an excluded word but are classic new-grad roles.
  override_exclude:
    - associate product manager
    - associate program manager
    - new grad
    - early career
    - rotational
    - staff accountant
    - staff assistant

  # Roles requiring this many years of experience or more are excluded.
  max_years_required: 2

  # Internships: "exclude" (drop all), "paid_only" (keep only ones that
  # show pay), or "include".
  internships: paid_only

  # Roles whose description doesn't say how much experience is needed are
  # shown with an "Experience not stated" tag. This decides which of them stay:
  #   entry_titles - only if the title has an entry-level word (above)
  #   non_tech     - also neutral titles, except tech/data roles
  #   all          - every neutral title too
  include_vague: entry_titles

  # Phrases in the title or description that exclude a posting outright.
  exclude_phrases:
    unpaid:
      - unpaid
      - this is a volunteer position
      - volunteer opportunity
    commission_only:
      - commission only
      - commission-only
      - 100% commission
      - straight commission
      - commission based pay only
    mlm:
      - brand ambassador
      - be your own boss
      - unlimited earning potential
      - independent distributor
      - multi-level marketing
      - network marketing

# Category tags. A posting gets the first category (in this order) whose
# words appear in its title. If the title doesn't match, its department or
# team name is tried; otherwise it's Other. Sources marked
# sector: nonprofit / government always get Nonprofit / Government.
categories:
  - name: Design
    words: [design, designer, ux, ui, graphic, illustrator, creative, visual designer, art director, animator, motion]
  - name: Healthcare
    words: [health, healthcare, clinical, clinic, medical, patient, nurse, nursing, pharmacy, pharmacist, care coordinator, medical assistant, dental, therapist, wellness, behavioral health]
  - name: Finance
    words: [finance, financial, accounting, accountant, bookkeeper, bookkeeping, tax, audit, auditor, treasury, fp&a, underwriter, underwriting, credit, investment, banking, billing, collections, accounts payable, accounts receivable]
  - name: Legal
    words: [legal, paralegal, counsel, attorney, compliance, contracts, regulatory, policy, privacy]
  - name: Data/Analytics
    words: [data, analyst, analytics, insights, business intelligence, bi, statistician, research analyst, quantitative]
  - name: Science/Research
    words: [research scientist, associate scientist, lab scientist, life science, lab, laboratory, research associate, research assistant, biology, biologist, chemistry, chemist, bioinformatics, genomics, assay, r&d]
  - name: Education
    words: [education, teacher, teaching, tutor, instructor, curriculum, instructional, learning experience, learning designer, admissions, k-12, student success]
  - name: Merchandising
    words: [merchandising, merchandiser, merchant, buyer, assortment, allocation, planner, retail, store, inventory planning]
  - name: Marketing
    words: [marketing, growth, seo, sem, social media, brand, campaign, demand generation, lifecycle, community, influencer, partnerships marketing, product marketing, events]
  - name: Communications
    words: [communications, communication, public relations, pr, writer, editor, copywriter, content, journalist, media relations, editorial, comms, speechwriter, producer, video, podcast]
  - name: Sales
    words: [sales, account executive, sales development, business development, sdr, bdr, account manager, inside sales, partnerships, revenue]
  - name: Customer Support
    words: [customer support, customer success, customer experience, customer service, client services, member services, member support, support associate, support specialist, support representative, care team]
  - name: People/HR
    words: [recruiting coordinator, recruiter, recruiting, sourcer, sourcing, people, hr, human resources, talent, people operations]
  - name: Admin
    words: [administrative, admin, executive assistant, office, receptionist, front desk, scheduler, clerk]
  - name: Tech
    words: [engineer, engineering, developer, software, it, technical, technician, qa, quality assurance, security, devops, sre, infrastructure, machine learning, ml, ai, applied scientist, help desk, helpdesk, systems, network, programmer, web]
  - name: Operations
    words: [operations, ops, logistics, supply chain, procurement, fulfillment, support, program, project, coordinator, facilities, payroll]
